<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScenarijPro</title>
    <link rel="stylesheet" href="user.css">
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">Postavke korisničkog računa</h1>
        <hr class="form-divider">
        <p class="form-subtitle">Upravljajte vašim korisničkim računom, sigurnosnim postavkama i notifikacijama</p>
        
        <!-- Podaci o korisniku -->
        <section class="section account-info">
            <h2>Podaci o korisničkom računu</h2>
            <div class="form-group">
                <label for="fullName">Ime i prezime</label>
                <input type="text" id="fullName" placeholder="User User">
            </div>
            <div class="form-group">
                <label for="email">Email adresa</label>
                <input type="email" id="email" placeholder="user.user@example.com">
            </div>
            <div class="form-group">
                <label for="itemsPerPage">Broj elemenata po stranici</label>
                <input type="number" id="itemsPerPage" min="1" max="100" placeholder="1-100">
            </div>
        </section>

        <!-- Sigurnosne postavke -->
        <section class="section security">
            <h2>Sigurnosne postavke</h2>
            <div class="form-group">
                <label for="password">Nova šifra</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="twoFA">
                <label for="twoFA">Omogući Two-Factor Authentication (2FA)</label>
            </div>
        </section>

        <!-- Notifikacije -->
        <section class="section notifications">
            <h2>Notifikacije</h2>
            <div class="radio-group-wrapper">
                <label>Preferirani način komunikacije</label>
                <div class="radio-group">
                    <input type="radio" id="emailRadio" name="contactMethod" checked>
                    <label for="emailRadio">Email</label>
                    <input type="radio" id="smsRadio" name="contactMethod">
                    <label for="smsRadio">SMS</label>
                    <input type="radio" id="noneRadio" name="contactMethod">
                    <label for="noneRadio">None</label>
                </div>
            </div>
            <div class="form-group">
                <label for="frequency">Notification frequency</label>
                <select id="frequency">
                    <option value="daily" selected>Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="never">Never</option>
                </select>
            </div>
        </section>

        <button class="save-btn">Spasi promjene</button>
    </div>
</body>
</html>
